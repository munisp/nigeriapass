<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1B2B4B" />
  <title>NigerianPass — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1B2B4B;
      color: #ffffff;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .logo {
      width: 80px; height: 80px;
      background: rgba(16, 185, 129, 0.15);
      border: 2px solid rgba(16, 185, 129, 0.4);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: 800;
      color: #10b981;
      margin: 0 auto 1.5rem;
      letter-spacing: -1px;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { color: rgba(255,255,255,0.6); font-size: 0.95rem; line-height: 1.6; max-width: 320px; margin: 0 auto 2rem; }
    .ussd-box {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 1rem 1.5rem;
      margin-bottom: 2rem;
      max-width: 280px;
    }
    .ussd-box p { color: rgba(255,255,255,0.5); font-size: 0.8rem; margin-bottom: 0.5rem; }
    .ussd-code {
      font-size: 1.5rem; font-weight: 800;
      color: #10b981;
      letter-spacing: 2px;
      font-family: monospace;
    }
    button {
      background: #10b981;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0.75rem 2rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #059669; }
    .dots { display: flex; gap: 6px; justify-content: center; margin-top: 1.5rem; }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(255,255,255,0.2);
      animation: pulse 1.5s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.3s; }
    .dot:nth-child(3) { animation-delay: 0.6s; }
    @keyframes pulse {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }
  </style>
</head>
<body>
  <div class="logo">NP</div>
  <h1>You're Offline</h1>
  <p>No internet connection detected. Some features require connectivity, but you can still access cached pages.</p>

  <div class="ussd-box">
    <p>For feature phones, dial:</p>
    <div class="ussd-code">*346#</div>
  </div>

  <button onclick="window.location.reload()">Try Again</button>

  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <script>
    // Auto-reload when connection is restored
    window.addEventListener("online", () => window.location.reload());
  </script>
</body>
</html>
